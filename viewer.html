<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sailor Moon Pattern</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1c1a; --muted: #6b6862;
    --border: #dedbd4; --empty: #ebe8e1; --accent: #0077b3; --edge: #c41e3a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --surface: #1f1f1d; --text: #ecebe7; --muted: #9c9993;
      --border: #34332f; --empty: #2a2926; --accent: #4cb8f0; --edge: #ff5a73;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --surface: #1f1f1d; --text: #ecebe7; --muted: #9c9993;
    --border: #34332f; --empty: #2a2926; --accent: #4cb8f0; --edge: #ff5a73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 19px; margin: 0 0 4px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-top: 20px;
  }
  .toolbar { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  .toolbar label { display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }

  /* Board map */
  .boards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .board {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12.5px;
    background: var(--bg); min-height: 92px;
  }
  .board b { display: block; font-size: 13px; }
  .board.has-grid { border-color: var(--accent); cursor: pointer; }
  .board.has-grid b::after { content: " · grid ↓"; color: var(--accent); font-weight: 500; }
  @media (max-width: 640px) { .boards { grid-template-columns: repeat(2, 1fr); } }

  /* Bead grid */
  .grid-wrap { overflow-x: auto; margin: 14px 0 10px; padding-bottom: 4px; }
  .grid {
    display: grid; gap: 1px; width: max-content;
    grid-template-columns: 34px repeat(var(--cols), var(--bead));
  }
  .rownum { font: 11px/var(--bead) ui-monospace, monospace; color: var(--muted); text-align: right; padding-right: 6px; }
  .bead {
    width: var(--bead); height: var(--bead); border-radius: 50%; position: relative;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
    display: flex; align-items: center; justify-content: center;
    font: 600 9px ui-monospace, monospace; color: rgba(0,0,0,.55);
  }
  .bead.dark { color: rgba(255,255,255,.75); }
  .bead::before {
    content: ""; position: absolute; width: 32%; height: 32%; border-radius: 50%;
    background: rgba(0,0,0,.22);
  }
  .grid.symbols .bead::before { display: none; }
  .bead.empty { background: repeating-linear-gradient(45deg, var(--empty) 0 3px, transparent 3px 6px); box-shadow: none; }
  .bead.empty::before { display: none; }
  body.dim-inferred .bead.inferred { opacity: .55; }
  .grid:not(.symbols) .bead span { display: none; }
  .edge { grid-column: 1 / -1; height: 0; border-top: 2px dashed var(--edge); margin: 2px 0; position: relative; }
  .edge span { position: absolute; right: 0; top: -9px; font-size: 11px; color: var(--edge); background: var(--surface); padding: 0 4px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
  .legend li { display: flex; gap: 8px; align-items: center; }
  .swatch { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); flex: none; }
  .sym { font: 600 12px ui-monospace, monospace; min-width: 12px; }
  .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; padding-left: 10px; border-left: 3px solid var(--border); }
  .tip {
    position: fixed; pointer-events: none; background: var(--text); color: var(--bg);
    font-size: 12px; padding: 4px 8px; border-radius: 6px; display: none; z-index: 10;
  }
  .previews { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 12px; }
  .preview { flex: 1 1 300px; min-width: 0; }
  .preview canvas { display: block; width: 100%; max-width: 480px; height: auto; border-radius: 6px; }
  .preview h3 { font-size: 15px; margin: 0 0 4px; }
  .preview p { font-size: 13px; }
</style>
</head>
<body class="dim-inferred">
<main>
  <h1 id="title"></h1>
  <p class="muted" id="about"></p>

  <div class="toolbar">
    <label><input type="checkbox" id="showSymbols"> Show symbols</label>
    <label><input type="checkbox" id="dimInferred" checked> Fade inferred background</label>
    <label>Bead size <input type="range" id="size" min="10" max="26" value="16"></label>
  </div>

  <section class="card">
    <h2>Finished piece</h2>
    <p class="muted">The left preview is everything the PDF actually specifies. The right one is a rough render from its photo, for the overall look.</p>
    <div class="previews" id="previews"></div>
  </section>

  <section class="card">
    <h2>Board layout</h2>
    <p class="muted">4 × 4 grid of 28 × 28 pegboards. Only the outlined boards have bead-level grids in the PDF. The rest are prose instructions only.</p>
    <div class="boards" id="boards"></div>
  </section>

  <div id="sections"></div>
</main>

    li.append(el('span', 'sym', sym), sw,
      el('span', null, (pal ? pal.name : 'Empty') + (entry.inferred ? ' (inferred)' : '')),
      el('span', 'muted', `×${counts[sym]}`));
    legend.append(li);
  }
  card.append(legend);

  // Grid
  const wrap = el('div', 'grid-wrap');
  const grid = el('div', 'grid');
  grid.style.setProperty('--cols', s.width);
  for (const r of s.rows) {
    grid.append(el('div', 'rownum', String(r.n).padStart(2, '0')));
    for (let c = 0; c < s.width; c++) {
      const sym = c < r.beads.length ? r.beads[c] : s.padWith;
      const entry = sym != null ? s.legend[sym] : null;
      const pal = entry && entry.color ? P.palette[entry.color] : null;
      const bead = el('div', 'bead');
      if (pal) {
        bead.style.background = pal.hex;
        if (isDark(pal.hex)) bead.classList.add('dark');
        if (entry.inferred) bead.classList.add('inferred');
      } else bead.classList.add('empty');
      if (sym != null) bead.append(el('span', null, sym));
      bead.dataset.tip = `Row ${r.n}, col ${c + 1}: ` +
        (pal ? pal.name + (entry.inferred ? ' (inferred)' : '') : 'empty') +
        (c >= r.beads.length ? ' · padded' : '');
      grid.append(bead);
    }
    if (s.canvasEdgeAfterRow === r.n) {
      const edge = el('div', 'edge');
      edge.append(el('span', null, 'canvas edge'));
      grid.append(edge);
    }
  }
  grid.addEventListener('mousemove', (e) => {
    const t = e.target.closest('.bead');
    if (!t) { tip.style.display = 'none'; return; }
    tip.textContent = t.dataset.tip;
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
  });
  grid.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  wrap.append(grid);
  card.append(wrap);

  for (const n of s.notes) card.append(el('p', 'note', n));
  for (const [sym, entry] of Object.entries(s.legend)) {
    if (counts[sym] && entry.note && (entry.inferred || /carried over|In this legend/.test(entry.note)))
      card.append(el('p', 'note', `“${sym}”: ${entry.note}`));
  }
  host.append(card);
}

// Controls
const grids = () => document.querySelectorAll('.grid');
$('showSymbols').onchange = (e) => grids().forEach(g => g.classList.toggle('symbols', e.target.checked));
$('dimInferred').onchange = (e) => document.body.classList.toggle('dim-inferred', e.target.checked);
// Full-canvas previews
function drawPreview(pv) {
  const cell = 8, r = cell / 2;
  const cv = document.createElement('canvas');
  cv.width = pv.width * cell; cv.height = pv.height * cell;
  const ctx = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  // Hatch pattern for unspecified cells.
  const hp = document.createElement('canvas'); hp.width = hp.height = 6;
  const hctx = hp.getContext('2d');
  hctx.strokeStyle = css.getPropertyValue('--empty').trim() || '#ddd'; hctx.lineWidth = 1.5;
  hctx.beginPath(); hctx.moveTo(0, 6); hctx.lineTo(6, 0); hctx.stroke();
  ctx.fillStyle = ctx.createPattern(hp, 'repeat');
  pv.rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') { ctx.fillRect(x * cell, y * cell, cell, cell); return; }
    ctx.save();
    ctx.fillStyle = P.palette[P.previewKey[ch]].hex;
    ctx.beginPath(); ctx.arc(x * cell + r, y * cell + r, r - 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.arc(x * cell + r, y * cell + r, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }));
  if (pv.canvasEdgeAfterRow) {
    ctx.strokeStyle = css.getPropertyValue('--edge').trim(); ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(0, pv.canvasEdgeAfterRow * cell); ctx.lineTo(cv.width, pv.canvasEdgeAfterRow * cell); ctx.stroke();
  }
  return cv;
}
for (const pv of P.previews) {
  const d = el('div', 'preview');
  const meta = `${pv.width} × ${pv.height} beads` + (pv.specifiedPercent != null ? ` · ${pv.specifiedPercent}% of beads specified` : '');
  d.append(el('h3', null, pv.title), el('p', 'muted', meta), drawPreview(pv), el('p', 'muted', pv.description));
  $('previews').append(d);
}

const setSize = (v) => document.documentElement.style.setProperty('--bead', v + 'px');
$('size').oninput = (e) => setSize(e.target.value);
setSize($('size').value);
</script>
</body>
</html>
